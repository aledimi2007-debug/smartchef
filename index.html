<script>
// ---------- ALIMENTI: vuoto, lo riempi tu (o l’AI)
const F={};
const CAT={O:'🥬 Ortofrutta',C:'🥩 Carne & Pesce',L:'🧀 Freschi & Latticini',D:'🥫 Dispensa',S:'❄️ Surgelati'};
const st=s=>s.slice(0,Math.max(4,s.length-1)),mt=(p,f)=>{const n=f.n.toLowerCase();p=p.toLowerCase();return n.includes(p)||n.split(/\s+/).some(w=>w.length>3&&p.length>3&&st(w)==st(p))};
let CW=0;const rc=r=>parse(r.ing).filter(x=>!x.o&&!S.cfg.pan.some(k=>mt(k,F[x.id]))).reduce((a,x)=>a+x.g/1000*F[x.id].pr,0);
function toast(m){const d=document.createElement('div');d.textContent=String(m).slice(0,300);d.style.cssText='position:fixed;left:12px;right:12px;bottom:90px;background:var(--ac);color:var(--bt);padding:10px 14px;border-radius:12px;z-index:50;text-align:center';document.body.appendChild(d);setTimeout(()=>d.remove(),14000)}
const TAGS=['lattosio','formaggio','glutine','funghi','pesce','uova','carne','legumi'];
const D=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'],DL=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'],M=['Pranzo','Cena'],MS=[.4,.35];
const SYS=[];
// ---------- STATO ----------
const AF={s:1.2,m:1.45,a:1.7};let S,tab=0,showSet=false,ed=null,busy=false;
const def=()=>({sub:'Per te, con amore ♥',prof:[{id:'u1',name:'Lei',a:28,sex:'F',w:60,h:165,act:'m',goal:'t',ex:[],free:'',on:true},{id:'u2',name:'Io',a:30,sex:'M',w:78,h:180,act:'m',goal:'m',ex:[],free:'',on:true}],pres:{},rec:[],cfg:{bud:70,store:0,n:2,pan:[],key:''},plan:null,chk:{}});
try{S=JSON.parse(localStorage.getItem('sc3'))}catch(e){}
if(!S){try{const o=JSON.parse(localStorage.getItem('sc2')||localStorage.getItem('sc1'));if(o){S=o;S.rec=[];S.cf=[];S.plan=null;S.chk={}}}catch(e){}}
if(!S)S=def();S.cfg.pan=S.cfg.pan||[];S.cf=S.cf||[];S.rec=S.rec||[];S.cf.forEach(f=>F[f.id]=f);
const save=()=>{try{localStorage.setItem('sc3',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),E=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const nm=id=>(S.prof.find(p=>p.id==id)||{}).name||'?';
// ---------- LOGICA ----------
function calc(p){const bmr=10*p.w+6.25*p.h-5*p.a+(p.sex=='M'?5:-161);let k=bmr*AF[p.act];if(p.goal=='d')k*=.85;k=Math.round(k);const pr=Math.round(p.w*(p.goal=='t'?1.6:p.goal=='d'?1.3:1.1)),fa=Math.round(k*.3/9);return{k,pr,fa,ch:Math.round((k-pr*4-fa*9)/4),fi:Math.round(k/1000*14)}}
const parse=s=>s.split(',').map(x=>{const o=x[0]=='*',[id,g]=x.replace('*','').split(':');return{id,g:+g,o}}).filter(i=>F[i.id]);
const nutr=it=>it.reduce((a,[id,g])=>{const f=F[id],x=g/100;a.k+=f.k*x;a.p+=f.p*x;a.c+=f.c*x;a.f+=f.f*x;a.fi+=f.fi*x;return a},{k:0,p:0,c:0,f:0,fi:0});
const exc=(p,id)=>{const f=F[id];return[...p.ex,...(p.fl||[])].some(s=>mt(s,f)||f.t.includes(s))};
const allowed=(r,pp)=>parse(r.ing).every(i=>i.o||!pp.some(p=>exc(p,i.id)));
const grp=r=>{for(const i of parse(r.ing)){if(i.o)continue;const t=F[i.id].t;for(const x of['carne','pesce','uova','legumi'])if(t.includes(x))return x;if(t.includes('formaggio'))return'latticini'}return'vegetale'};
const present=i=>S.prof.filter(p=>p.on&&S.pres[p.id]&&S.pres[p.id][i>>1][i&1]);
// Costruisce un pasto: dosi per persona dal suo fabbisogno (bottom-up dagli ingredienti)
function build(r,pp,m){const base=nutr(parse(r.ing).filter(i=>!i.o).map(i=>[i.id,i.g])).k||1;
return{r,pp:pp.map(p=>{const f=Math.max(.6,Math.min(1.8,calc(p).k*MS[m]/base)),items=[],skip=[];
for(const i of parse(r.ing)){if(i.o&&exc(p,i.id)){skip.push(F[i.id].n);continue}items.push([i.id,Math.max(5,Math.round(i.g*f/5)*5)])}
return{pid:p.id,items,skip}})}}
const gAt=i=>S.plan[i]?grp(S.plan[i].r):null;
// Scelta locale: niente stessa fonte proteica in pasti consecutivi, rotazione e minima ripetizione
function pick(i,not){const used={};S.plan.forEach(s=>s&&(used[s.r.id]=(used[s.r.id]||0)+1));const pp=present(i);
const sc=r=>(grp(r)==gAt(i-1)||grp(r)==gAt(i+1)?100:0)+(used[r.id]||0)*10+rc(r)*CW*6+Math.random();
const c=S.rec.filter(r=>r.id!==not&&allowed(r,pp)).sort((a,b)=>sc(a)-sc(b));return c[0]}
// Motore AI (Gemini Flash) con fallback locale se manca la chiave o la chiamata fallisce
async function aiSeq(n){const k=S.cfg.key;if(!k||!n)return null;try{
const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${k}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:`Sei un nutrizionista italiano. Scegli una sequenza di ${n} id di piatti per una settimana (pranzi e cene in ordine) dall’elenco, mai lo stesso gruppo proteico in due pasti consecutivi, ruotando legumi 3-4 volte, pesce 2-3, carne 2-3, uova 2. Rispondi solo con un array JSON di id.\n`+SYS.map(c=>c.id+' ('+grp(c)+')').join(', ')}]}],generationConfig:{responseMimeType:'application/json'}})});
const j=await r.json();return JSON.parse(j.candidates[0].content.parts[0].text)}catch(e){return null}}
// ---------- ALIMENTI DINAMICI + RICETTE GENERATE DA GEMINI ----------
const slug=s=>'g_'+s.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'_').slice(0,24);
function regFood(name,d){const n=String(name).trim(),l=n.toLowerCase();let f=Object.values(F).find(x=>x.n.toLowerCase()==l);
if(!f&&!d){f=Object.values(F).find(x=>mt(l,x));return f&&f.id}
if(f&&!(d&&f.cu))return f.id;
const c=x=>+x>0?+x:0,o={n,cat:CAT[d.cat]?d.cat:'D',pr:+d.pr>0?+d.pr:5,pk:+d.pk>0?+d.pk:250,k:c(d.k),p:c(d.p),c:c(d.c),f:c(d.f),fi:c(d.fi),t:(Array.isArray(d.t)?d.t:String(d.t||'').split(',')).map(x=>String(x).trim().toLowerCase()).filter(Boolean),cu:1};
if(f){Object.assign(F[f.id],o);S.cf=S.cf.map(x=>x.id==f.id?F[f.id]:x);save();return f.id}
let id=slug(n),i=2;while(F[id])id=slug(n)+i++;o.id=id;F[id]=o;S.cf.push(o);save();return id}
let bmsg='',LM='',LE='';
// Groq (chiavi che iniziano con gsk_): API compatibile OpenAI, molto veloce, con piano gratuito
async function gq(text){const H={'Content-Type':'application/json',Authorization:'Bearer '+S.cfg.key},ms=['llama-3.3-70b-versatile','openai/gpt-oss-120b','llama-3.1-8b-instant'];LE='';let disc=0;
for(let q=0;q<ms.length;q++){const m=ms[q];try{const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:H,body:JSON.stringify({model:m,messages:[{role:'user',content:text}],response_format:{type:'json_object'},temperature:.7,max_tokens:6000})}),j=await r.json();if(!j.choices)throw new Error(j.error&&j.error.message||'risposta vuota');const o=JSON.parse(j.choices[0].message.content);LM=m;return o}catch(e){LE=(LE?LE+' | ':'')+m+': '+e.message;if(/invalid api key/i.test(e.message))break;
if(q==ms.length-1&&!disc){disc=1;try{const lj=await(await fetch('https://api.groq.com/openai/v1/models',{headers:H})).json();(lj.data||[]).map(x=>x.id).filter(n=>/llama|gpt-oss|qwen|kimi/.test(n)&&!/whisper|guard|tts|prompt|safeguard|vision|distil/.test(n)&&!ms.includes(n)).slice(0,4).forEach(n=>ms.push(n))}catch(e2){}}}}throw new Error(LE)}
async function TG(){toast('Provo a contattare l’AI…');try{await gem('Rispondi solo con JSON {"ok":true}');toast('L’AI funziona (modello: '+LM+')')}catch(e){toast('Errore AI: '+(LE||e.message||e))}}
async function gem(text){if(/^gsk_/.test(S.cfg.key))return gq(text);let err;LE='';const ML=(LM?[LM]:[]).concat(['gemini-3.5-flash-lite','gemini-flash-latest'].filter(x=>x!=LM));let disc=0;for(let q=0;q<ML.length;q++){const m=ML[q],ac=new AbortController(),tm=setTimeout(()=>ac.abort(),90000);try{const gc={responseMimeType:'application/json',maxOutputTokens:8192};if(m=='gemini-2.5-flash')gc.thinkingConfig={thinkingBudget:0};const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent?key='+S.cfg.key,{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text}]}],generationConfig:gc})}),j=await r.json();if(!j.candidates)throw new Error(j.error&&j.error.message||'risposta vuota');const o=JSON.parse(j.candidates[0].content.parts[0].text);LM=m;return o}catch(e){err=new Error(m+': '+(e.name=='AbortError'?'tempo scaduto (90 s)':e.message));LE=(LE?LE+' | ':'')+err.message;if(/API key|permission/i.test(err.message))throw err;await new Promise(r=>setTimeout(r,4000));if(q==ML.length-1&&!disc){disc=1;try{const lj=await(await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key='+S.cfg.key)).json();(lj.models||[]).filter(x=>/flash/.test(x.name)&&!/image|tts|live|audio|embed|vision|robot|native|thinking|exp/.test(x.name)&&(x.supportedGenerationMethods||[]).includes('generateContent')).map(x=>x.name.replace('models/','')).filter(n=>!ML.includes(n)).slice(0,4).forEach(n=>ML.push(n))}catch(e2){}}}finally{clearTimeout(tm)}}throw err}
const FS='Per ogni ingrediente NON presente nell’elenco aggiungi in "foods" un oggetto {"n":nome,"cat":"O|C|L|D|S","pr":prezzo medio €/kg in Italia,"pk":grammi della confezione tipica (100 se sfuso),"k":kcal,"p":proteine,"c":carboidrati,"f":grassi,"fi":fibre (tutti per 100 g, valori reali),"t":[tag]}. cat: O ortofrutta, C carne e pesce, L freschi e latticini, D dispensa, S surgelati. Tag ammessi: carne,pesce,uova,legumi,formaggio,lattosio,glutine,funghi,soia,crostacei,frutta secca.';
const foodPrompt=ns=>'Alimenti venduti nei supermercati italiani: '+ns.join(', ')+'. Usa come "n" esattamente il nome dato. Rispondi SOLO con JSON {"foods":[...]}. Ogni elemento: '+FS.replace('Per ogni ingrediente NON presente nell’elenco aggiungi in "foods" un oggetto','');
async function aiMeals(idx,note){const known=Object.values(F).map(f=>f.n).join(', ');
const sl=idx.map(i=>'slot '+i+' ('+DL[i>>1]+' '+M[i&1]+'): '+present(i).map(p=>p.name+' [esclude: '+([...p.ex,...p.fl].join('/')||'niente')+'; target '+Math.round(calc(p).k*MS[i&1])+' kcal]').join('; ')).join(' | ');
const o=await gem('Sei uno chef e nutrizionista italiano. Crea una ricetta per ciascuno di questi pasti: '+sl+'. Regole: dieta mediterranea sana; ingredienti reali acquistabili in un supermercato italiano (qualsiasi alimento va bene); grammature crude per 1 persona adulta; elenca per primo l’ingrediente proteico principale; mai usare come ingrediente normale un cibo escluso da uno dei presenti (se è escluso solo da alcuni, mettilo con "opt":true così verrà omesso per loro e spiegalo nei passi); non la stessa fonte proteica (carne, pesce, uova, legumi, latticini) in due slot consecutivi; nella settimana ruota legumi 3-4 volte, pesce 2-3, carne bianca 2-3, uova 2, almeno 4-5 verdure e vari cereali; riusa ingredienti tra ricette per evitare sprechi; solo cibo, niente prodotti non alimentari; budget settimanale '+S.cfg.bud+' € (supermercato '+['discount','standard'][S.cfg.store]+'). Già in dispensa: '+(S.cfg.pan.join(', ')||'nulla')+'. '+(note||'')+' Elenco ingredienti già scelti dall’utente (preferiscili e usa questi nomi esatti quando possibile; se l’elenco è vuoto scegli liberamente): '+known+'. '+FS+' Rispondi SOLO con JSON: {"meals":[{"slot":numero,"n":"nome piatto","t":minuti,"st":["passo 1","passo 2","passo 3","passo 4"],"ing":[{"n":"nome","g":grammi,"opt":false}]}],"foods":[]}');
(o.foods||[]).forEach(d=>d&&d.n&&regFood(d.n,d));
return(o.meals||[]).map(m=>{const ing=[];(m.ing||[]).forEach(x=>{const id=x&&x.n&&regFood(x.n);if(id&&+x.g>0)ing.push((x.opt?'*':'')+id+':'+Math.round(x.g))});return ing.length?{slot:+m.slot,r:{id:'a'+Date.now()+'_'+m.slot,n:String(m.n),t:+m.t||25,tags:[],ing:ing.join(','),st:(m.st||[]).map(String)}}:null}).filter(Boolean)}
// Piano completo con Gemini: fino a 3 tentativi per rientrare nel budget
async function GA(){const L=[];for(let i=0;i<14;i++)if(present(i).length)L.push(i);if(!L.length)throw new Error('nessuno presente');
const base=Array(14).fill(null);S.plan=base;const ls=[...L].sort(()=>Math.random()-.5);
for(const r of[...S.rec].sort(()=>Math.random()-.5).slice(0,S.cfg.n)){const i=ls.find(j=>!base[j]&&allowed(r,present(j)));if(i!==undefined)base[i]=build(r,present(i),i&1)}
const rest=L.filter(i=>!base[i]);if(!rest.length)return true;let best=null,bc=1e9,note='';
for(let a=0;a<2;a++){bmsg='L’AI sta scrivendo le ricette (tentativo '+(a+1)+'/2, può volerci un minuto)…';R();const ms=await aiMeals(rest,note);S.plan=base.slice();
for(const i of rest){const m=ms.find(x=>x.slot==i),r=m&&m.r,ok=r&&allowed(r,present(i))&&grp(r)!=gAt(i-1)&&grp(r)!=gAt(i+1),u=ok?r:pick(i);if(u)S.plan[i]=build(u,present(i),i&1)}
const c=cost(S.plan);if(c<bc){bc=c;best=S.plan}if(c<=S.cfg.bud)break;note='Il tentativo precedente costava circa '+c.toFixed(0)+' € contro un budget di '+S.cfg.bud+' €: usa ingredienti più economici e stagionali, più legumi, uova e cereali, e riusa gli ingredienti.'}
S.plan=best;if(bc>S.cfg.bud)S.warn='L’AI non è riuscita a stare nel budget: stima '+bc.toFixed(2)+' € (budget '+S.cfg.bud+' €). Alza il budget o riduci i pasti.';return true}
async function autoFoods(){if(!S.cfg.key)return;const un=[];$('#ri').value.split('\n').forEach(l=>{const m=l.trim().match(/^(\*?)\s*(.+?)\s+(\d+(?:[.,]\d+)?)\s*g?$/i);if(m&&!Object.values(F).some(f=>f.n.toLowerCase().includes(m[2].toLowerCase())))un.push(m[2])});if(!un.length)return;try{toast('Cerco valori e prezzi con l’AI…');const o=await gem(foodPrompt(un));(o.foods||[]).forEach(d=>d&&d.n&&regFood(d.n,d))}catch(e){toast('AI: '+(LE||e.message||e))}}
async function FI(){const n=$('#fn').value.trim();if(!n)return toast('Scrivi prima il nome');try{toast('Chiedo all’AI…');const o=await gem(foodPrompt([n])),d=(o.foods||[])[0];if(!d)throw new Error('vuoto');$('#fc').value=CAT[d.cat]?d.cat:'D';$('#fp').value=d.pr;$('#fk').value=d.pk;$('#ft').value=(d.t||[]).join(', ');$('#fkc').value=d.k;$('#fpr').value=d.p;$('#fch').value=d.c;$('#fgr').value=d.f;$('#ffi').value=d.fi}catch(e){toast('AI: '+(LE||e.message||e))}}
function SF(){const n=$('#fn').value.trim();if(!n||$('#fp').value===''||$('#fkc').value==='')return toast('Servono almeno nome, prezzo €/kg e kcal');regFood(n,{cat:$('#fc').value,pr:$('#fp').value,pk:$('#fk').value,t:$('#ft').value,k:$('#fkc').value,p:$('#fpr').value,c:$('#fch').value,f:$('#fgr').value,fi:$('#ffi').value});toast('Alimento salvato');R()}
const foodUI=()=>`<details class="card mb-3 text-sm" ${Object.keys(F).length?'':'open'}><summary class="font-bold">🧺 I miei alimenti (${Object.keys(F).length}) · aggiungi o elimina</summary><div class="grid grid-cols-2 gap-2 mt-2"><label class="col-span-2">Nome<input id="fn" class="inp"></label><label>Corsia<select id="fc" class="inp">${opt(Object.entries(CAT),'O')}</select></label><label>€/kg<input id="fp" type="number" step="0.1" class="inp"></label><label>Confezione (g)<input id="fk" type="number" value="250" class="inp"></label><label>Tag<input id="ft" class="inp" placeholder="carne, glutine…"></label><label>Kcal/100g<input id="fkc" type="number" class="inp"></label><label>Proteine<input id="fpr" type="number" class="inp"></label><label>Carbo<input id="fch" type="number" class="inp"></label><label>Grassi<input id="fgr" type="number" class="inp"></label><label>Fibre<input id="ffi" type="number" class="inp"></label></div><div class="flex gap-2 mt-3">${S.cfg.key?'<button class="btn2" onclick="FI()">Compila con l’AI</button>':''}<button class="btn" onclick="SF()">Salva alimento</button></div><div class="mu text-xs mt-2">Con la chiave AI gli ingredienti nuovi delle ricette vengono aggiunti da soli, con valori nutrizionali e prezzo.</div><div class="mt-3 font-semibold">Alimenti salvati</div>${Object.values(F).sort((a,b)=>a.n.localeCompare(b.n)).map(f=>`<div class="flex items-center justify-between gap-2 border-t py-1" style="border-color:var(--br)"><span>${E(f.n)} <span class="mu text-xs">${f.pr} €/kg · ${Math.round(f.k)} kcal</span></span><button class="mu px-2" onclick="RF('${f.id}')">✕</button></div>`).join('')||'<div class="mu text-xs">Nessun alimento: aggiungilo qui sopra o lascia che lo faccia l’AI.</div>'}</details>`;
async function G1(ai){const L=[];for(let i=0;i<14;i++)if(present(i).length)L.push(i);S.plan=Array(14).fill(null);
const put=(i,r)=>{if(r)S.plan[i]=build(r,present(i),i&1)};
const ps=[...S.rec].sort(()=>Math.random()-.5).slice(0,S.cfg.n),ls=[...L].sort(()=>Math.random()-.5);
